<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ECHO.EXE: a browser escape room</title>
  <meta name="description" content="ECHO.EXE: a nostalgic 5-sector browser escape room. Boot an old machine, crack a vault, restore the power, and free what's trapped inside." />
  <meta name="theme-color" content="#05070a" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Visual-only overlays, driven by fx.js (setCrtEnabled, flashScreen). -->
  <div id="crt-overlay" aria-hidden="true"></div>
  <div id="screen-flash" aria-hidden="true"></div>

  <!-- Sector progress bar + mute/menu buttons, built by sceneManager.js's
       renderChrome(); shown only while a level scene is active. -->
  <header id="statusbar" hidden></header>

  <!-- The active scene's content is mounted here by sceneManager.js. -->
  <main id="app" role="main" aria-live="polite"></main>

  <!-- Pause menu overlay, built by sceneManager.js's openMenu(). -->
  <div id="pause-menu" hidden></div>
  <!-- Toast shown by konami.js when the cheat code is entered. -->
  <div id="konami-toast" role="status" aria-live="polite"></div>

  <noscript>
    <p style="color:#d8f6e8;background:#05070a;padding:2rem;font-family:monospace;">
      ECHO.EXE needs JavaScript to boot. Please enable it to play.
    </p>
  </noscript>

  <!--
    Single entry point: js/main.js is loaded as an ES module, so the browser
    resolves and runs its whole import graph (state.js, sceneManager.js,
    audio.js, fx.js, utils.js, sprites.js, konami.js, and every file under
    js/scenes/) automatically in dependency order. There is no other script
    tag; main.js's boot() function (run on DOMContentLoaded) is what starts
    the game by calling sceneManager.js's goTo() on the #app element above.
  -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
